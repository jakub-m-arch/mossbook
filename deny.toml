# cargo-deny: licenses, advisories and a ban on networking crates (SPEC §1, §10).

[graph]
all-features = true

[advisories]
yanked = "deny"
ignore = [
  # proc-macro-error (unmaintained) comes in via gtk-rs 0.18 (Linux, a Tauri dependency). Nothing to replace on our side.
  { id = "RUSTSEC-2024-0370", reason = "transitive via tauri -> gtk 0.18 (Linux)" },
  # zbus_names / zvariant* (unmaintained, merged into zbus 6) come in via
  # tauri-plugin-opener -> zbus 5 on Linux (local D-Bus, not network). Informational only.
  { id = "RUSTSEC-2026-0370", reason = "transitive via tauri-plugin-opener -> zbus 5 (Linux)" },
  { id = "RUSTSEC-2026-0371", reason = "transitive via tauri-plugin-opener -> zbus 5 (Linux)" },
  { id = "RUSTSEC-2026-0372", reason = "transitive via tauri-plugin-opener -> zbus 5 (Linux)" },
]

[licenses]
# Only licenses compatible with GPL-3.0-or-later.
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "BSL-1.0",
  "Unicode-3.0",
  "MPL-2.0",
  "CC0-1.0",
  "GPL-3.0-or-later",
]
confidence-threshold = 0.9
unused-allowed-license = "allow"

[[licenses.clarify]]
crate = "mossbook"
expression = "GPL-3.0-or-later"
license-files = []

[[licenses.clarify]]
crate = "mossbook-core"
expression = "GPL-3.0-or-later"
license-files = []

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true
# Zero network: none of these crates may appear in the dependency tree.
#
# Exception: on Android/iOS tauri depends on reqwest unconditionally, but only
# uses it under `#[cfg(all(dev, mobile))]` (proxying the Vite dev server, tauri
# src/protocol/tauri.rs). That code does not exist in release builds. So reqwest
# is allowed only as a direct dependency of tauri, and hyper only under reqwest.
# The hard guarantee on Android is the missing INTERNET permission.
deny = [
  { crate = "reqwest", wrappers = ["tauri"], reason = "zero network (SPEC §1)" },
  { crate = "hyper", wrappers = ["reqwest", "hyper-util"], reason = "zero network (SPEC §1)" },
  { crate = "h2", reason = "zero network (SPEC §1)" },
  { crate = "h3", reason = "zero network (SPEC §1)" },
  { crate = "ureq", reason = "zero network (SPEC §1)" },
  { crate = "isahc", reason = "zero network (SPEC §1)" },
  { crate = "surf", reason = "zero network (SPEC §1)" },
  { crate = "attohttpc", reason = "zero network (SPEC §1)" },
  { crate = "curl", reason = "zero network (SPEC §1)" },
  { crate = "curl-sys", reason = "zero network (SPEC §1)" },
  { crate = "rustls", reason = "zero network (SPEC §1)" },
  { crate = "native-tls", reason = "zero network (SPEC §1)" },
  { crate = "openssl", reason = "zero network (SPEC §1)" },
  { crate = "tungstenite", reason = "zero network (SPEC §1)" },
  { crate = "quinn", reason = "zero network (SPEC §1)" },
  { crate = "tauri-plugin-http", reason = "zero network (SPEC §1)" },
  { crate = "tauri-plugin-updater", reason = "zero network (SPEC §1)" },
  { crate = "tauri-plugin-upload", reason = "zero network (SPEC §1)" },
  { crate = "tauri-plugin-websocket", reason = "zero network (SPEC §1)" },
  { crate = "tauri-plugin-log", reason = "no logging (CLAUDE.md)" },
  { crate = "sentry", reason = "zero telemetry (SPEC §1)" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
