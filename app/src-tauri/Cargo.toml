[package]
name = "mossbook"
description = "Mossbook: prywatny dziennik samopoczucia"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
name = "mossbook_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[dependencies]
# Recordings travel over IPC as base64 (voice notes, D-21); on Android also the
# device key to and from the Keystore plugin (fingerprint unlock).
base64 = "0.22.1"
mossbook-core = { path = "../../core" }
serde = { version = "1.0.229", features = ["derive"] }
tauri = { version = "2.12.4", features = [] }
tauri-plugin-clipboard-manager = "2.5.0"
tauri-plugin-dialog = "2.8.3"
tauri-plugin-fs = "2.7.1"
tauri-plugin-opener = "2.7.2"
time = "0.3.55"
zeroize = "1.9.1"

[target.'cfg(target_os = "linux")'.dependencies]
# WebKitGTK settings: media capture for voice notes (same version as wry uses).
webkit2gtk = "2.0.2"

[target.'cfg(target_os = "android")'.dependencies]
serde_json = "1.0.154"

[lints]
workspace = true

[dev-dependencies]
serde_json = "1.0.154"
tempfile = "3.27.0"
time = { version = "0.3.55", features = ["macros"] }
