name: Website

# Publishes site/ to GitHub Pages (https://jakub-m-arch.github.io/mossbook/).
# Download links point at the newest published release, so the site is rebuilt
# after the Homebrew workflow (which runs when a release is published) as well as
# when site/ changes. A `release` trigger would run on the tag, and the
# github-pages environment only accepts deployments from main.
# One-time setup: Settings → Pages → Source: GitHub Actions.
on:
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/pages.yml']
  workflow_run:
    workflows: [Homebrew]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Render with the latest release version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Releases are marked as pre-releases, so there is no "latest" release;
          # take the newest published one instead.
          tag=$(gh release list --repo "${{ github.repository }}" --exclude-drafts --limit 1 \
            --json tagName --jq '.[0].tagName')
          [ -n "$tag" ] || { echo "No published release found" >&2; exit 1; }
          echo "Latest release: $tag"
          site/render.sh "${tag#v}" _site
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
