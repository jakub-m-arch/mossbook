name: Homebrew

# Updates the cask in the jakub-m-arch/homebrew-mossbook tap once a release is
# *published* (draft URLs are not public yet). Needs the HOMEBREW_TAP_TOKEN secret:
# a fine-grained token with Contents read/write on that tap repository only.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish to the tap (e.g. v0.1.0)
        required: true

permissions:
  contents: read

jobs:
  cask:
    runs-on: ubuntu-24.04
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
    steps:
      - name: Check the tap token
        id: token
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "::notice::HOMEBREW_TAP_TOKEN is not set; skipping the tap update."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      # The cask template comes from the default branch (it does not depend on the
      # release and may be newer than the tag); only the checksums come from the release.
      # The ref must be explicit: a release event would otherwise check out the tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.token.outputs.skip != 'true'
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Render the cask from the release checksums
        if: steps.token.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download "$TAG" --repo "${{ github.repository }}" --pattern SHA256SUMS
          packaging/homebrew/render.sh "${TAG#v}" SHA256SUMS mossbook.rb
          cat mossbook.rb
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.token.outputs.skip != 'true'
        with:
          repository: jakub-m-arch/homebrew-mossbook
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap
      - name: Commit to the tap
        if: steps.token.outputs.skip != 'true'
        working-directory: tap
        run: |
          mkdir -p Casks
          cp ../mossbook.rb Casks/mossbook.rb
          git config user.name "mossbook-release"
          git config user.email "mossbook-release@users.noreply.github.com"
          git add Casks/mossbook.rb
          if git diff --cached --quiet; then
            echo "Cask already up to date."
          else
            git commit -m "mossbook ${TAG#v}"
            git push
          fi
