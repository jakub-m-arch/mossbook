name: Release

# Builds desktop installers for a version tag and attaches them, with SHA256SUMS,
# to a *draft* GitHub release. Nothing is published until a maintainer reviews the
# draft and publishes it by hand (see docs/release.md).
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-22.04 # older glibc: the AppImage and .deb run on more distributions
          - name: windows-x86_64
            os: windows-latest
          - name: macos-aarch64
            os: macos-latest
          - name: macos-x86_64
            # Intel runners are retired; cross-compile on Apple Silicon.
            os: macos-latest
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Tauri system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
        working-directory: app
      - name: Rust target for cross-compilation
        if: matrix.target
        run: rustup target add ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.name }}
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: tauri-cli
      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: app
          tauriScript: cargo tauri
          tagName: ${{ github.ref_name }}
          releaseName: Mossbook ${{ github.ref_name }}
          releaseBody: See CHANGELOG.md. Verify downloads against SHA256SUMS.
          releaseDraft: true
          prerelease: true
          args: ${{ matrix.target && format('--target {0}', matrix.target) || '' }}

  checksums:
    name: SHA256SUMS and provenance
    needs: build
    runs-on: ubuntu-24.04
    # Attestations are signed with the workflow's OIDC identity and stored by GitHub,
    # so anyone can check that an installer was built here from this commit
    # (`gh attestation verify <file> --repo jakub-m-arch/mossbook`, see SECURITY.md).
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Download release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release download "${{ github.ref_name }}" --repo "${{ github.repository }}" --dir dist
      - name: Compute and upload checksums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        working-directory: dist
        run: |
          rm -f SHA256SUMS
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS
          gh release upload "${{ github.ref_name }}" SHA256SUMS --repo "${{ github.repository }}" --clobber
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
