name: Release

# Builds desktop installers for a version tag and attaches them, with SHA256SUMS,
# to a *draft* GitHub release. Nothing is published until a maintainer reviews the
# draft and publishes it by hand (see docs/release.md).
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-22.04 # older glibc: the AppImage and .deb run on more distributions
          - name: windows-x86_64
            os: windows-latest
          - name: macos-aarch64
            os: macos-latest
          - name: macos-x86_64
            # Intel runners are retired; cross-compile on Apple Silicon.
            os: macos-latest
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Check that the tag matches the version in the code
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          # Test tags such as v0.1.3-rc.1 are allowed for the version in the code.
          case "${{ github.ref_name }}" in
            "v$version" | "v$version"-*) ;;
            *)
              echo "::error::Tag ${{ github.ref_name }} does not match version $version in Cargo.toml"
              exit 1
              ;;
          esac
      - name: Tauri system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
        working-directory: app
      - name: Rust target for cross-compilation
        if: matrix.target
        run: rustup target add ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.name }}
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: tauri-cli
      - uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: app
          tauriScript: cargo tauri
          tagName: ${{ github.ref_name }}
          releaseName: Mossbook ${{ github.ref_name }}
          releaseBody: See CHANGELOG.md. Verify downloads against SHA256SUMS.
          releaseDraft: true
          prerelease: true
          args: ${{ matrix.target && format('--target {0}', matrix.target) || '' }}

  checksums:
    name: SHA256SUMS and provenance
    needs: build
    runs-on: ubuntu-24.04
    # Attestations are signed with the workflow's OIDC identity and stored by GitHub,
    # so anyone can check that an installer was built here from this commit
    # (`gh attestation verify <file> --repo jakub-m-arch/mossbook`, see SECURITY.md).
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Download release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release download "${{ github.ref_name }}" --repo "${{ github.repository }}" --dir dist
      - name: Compute and upload checksums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        working-directory: dist
        run: |
          rm -f SHA256SUMS
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS
          gh release upload "${{ github.ref_name }}" SHA256SUMS --repo "${{ github.repository }}" --clobber
      - name: Attest build provenance
        uses: actions/attest-build-provenance@96278af6caaf10aea03fd8d33a09a777ca52d62f # v3.2.0
        with:
          subject-path: dist/*
