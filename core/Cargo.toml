[package]
name = "mossbook-core"
description = "Mossbook core: domain, crypto and storage (no Tauri)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
argon2 = { version = "0.6.0", default-features = false, features = ["alloc", "zeroize"] }
bip39 = { version = "3.0.0", default-features = false, features = ["alloc", "zeroize"] }
chacha20poly1305 = { version = "0.11.0", default-features = false, features = ["alloc", "zeroize"] }
ciborium = "0.2.2"
crypto_box = { version = "0.9.1", features = ["seal"] }
getrandom = "0.4.3"
hkdf = "0.13.0"
printpdf = { version = "0.12.8", default-features = false }
rusqlite = { version = "0.40.2", features = ["bundled"] }
secrecy = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_bytes = "0.11.19"
serde_json = "1.0.154"
sha2 = "0.11.1"
time = { version = "0.3.55", features = ["serde", "formatting", "parsing"] }
unicode-normalization = "0.1.26"
uuid = { version = "1.28.0", features = ["serde"] }
zeroize = { version = "1.9.1", features = ["derive"] }

[lints]
workspace = true

[dev-dependencies]
hex = "0.4.3"
proptest = "1.12.0"
serde_json = "1.0.154"
tempfile = "3.27.0"
time = { version = "0.3.55", features = ["macros", "parsing"] }
